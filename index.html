<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aero PVP</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Outfit:wght@200;300;400&display=swap');

    :root {
      --bg: #050505;
      --text: #ffffff;
      --muted: #888888;
      --accent: #d946ef;
      --border: #1f1f22;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* --- HEADER --- */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 48px;
      z-index: 100;
      background: linear-gradient(to bottom, rgba(5,5,5,0.8) 0%, rgba(5,5,5,0) 100%);
    }

    .logo {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      font-weight: 300;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text);
    }

    .logo span { color: var(--accent); }

    nav {
      display: flex;
      gap: 32px;
    }

    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 300;
      letter-spacing: 0.5px;
      transition: color 0.3s;
    }
    
    nav a:hover { color: var(--text); }

    .header-right {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .login-btn {
      color: var(--text);
      text-decoration: none;
      font-size: 13px;
      font-weight: 300;
      padding: 8px 16px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 4px;
      transition: background-color 0.3s;
    }
    .login-btn:hover { background-color: rgba(255,255,255,0.05); }

    /* --- HERO SECTION (STICKY EFFECT) --- */
    .hero {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 1;
      overflow: hidden;
    }

    /* Achtergrondfoto laag */
    .hero-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('https://cdn.jsdelivr.net/gh/Aero-PVP/Aero-PVP.github.io/assets/images/hero-dark.png');
      background-size: cover;
      background-position: center;
      z-index: 0;
      transform: scale(1.05);
      /* Native scroll-driven blur, geen JS = geen lag */
      animation: heroBlur linear both;
      animation-timeline: scroll(root);
      animation-range: 0 60vh;
    }

    @keyframes heroBlur {
      from { filter: blur(0px); }
      to   { filter: blur(3px); }
    }

    /* Overlay fade naar beneden */
    .hero::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, rgba(5,5,5,0.6) 0%, rgba(5,5,5,0.2) 40%, var(--bg) 100%);
      z-index: 1;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      margin-top: 40px;
      /* Native scroll-driven fade */
      animation: heroFade linear both;
      animation-timeline: scroll(root);
      animation-range: 0 60vh;
    }

    @keyframes heroFade {
      from { opacity: 1; }
      to   { opacity: 0; }
    }

    .hero h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 80px;
      font-weight: 200;
      letter-spacing: 10px;
      text-transform: uppercase;
      margin-bottom: 16px;
      margin-left: 10px;
      text-shadow: 0 0 20px rgba(255,255,255,0.2); 
    }

    .hero p {
      font-size: 16px;
      color: #e0e0e0;
      font-weight: 300;
      letter-spacing: 2px;
      margin-bottom: 48px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }

    .play-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: rgba(5,5,5,0.5);
      backdrop-filter: blur(5px);
      color: var(--text);
      font-size: 14px;
      font-weight: 400;
      text-decoration: none;
      padding: 12px 32px;
      border-radius: 2px;
      text-transform: uppercase;
      letter-spacing: 2px;
      border: 1px solid var(--accent);
      transition: background-color 0.3s, color 0.3s;
    }

    .play-btn:hover {
      background-color: var(--accent);
      color: #fff;
    }

    .online-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 24px;
      font-size: 12px;
      color: #e0e0e0;
      font-weight: 300;
      letter-spacing: 1px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .online-dot {
      width: 5px;
      height: 5px;
      background-color: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
    }

    /* --- ARENA SECTION --- */
    .arenas {
      position: relative;
      z-index: 2;
      background-color: var(--bg);
      width: 100%;
      padding: 100px 48px 120px;
      border-top: 1px solid var(--border);
    }

    .arenas h2 {
      font-size: 24px;
      font-weight: 300;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 48px;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 32px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .card {
      position: relative;
      background-color: #0a0a0a;
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 32px 24px;
      aspect-ratio: 4 / 3;
      transition: transform 0.4s, border-color 0.4s;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(255,255,255,0.2);
    }

    .card-bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      image-rendering: pixelated;
      z-index: 1;
      opacity: 0.6;
      transition: opacity 0.4s;
    }

    .card:hover .card-bg-image {
      opacity: 0.8;
    }

    .card-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to top, rgba(5,5,5,1) 0%, rgba(5,5,5,0) 100%);
      z-index: 2;
    }

    .card-content {
      position: relative;
      z-index: 3;
    }

    .card h3 {
      font-size: 16px;
      font-weight: 400;
      letter-spacing: 1px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .card p {
      color: var(--muted);
      font-size: 13px;
      font-weight: 300;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
      .hero h1 { font-size: 56px; letter-spacing: 5px; }
    }
    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; }
      header { padding: 24px; }
      nav, .header-right { display: none; }
      .hero h1 { font-size: 40px; letter-spacing: 2px; }
      .arenas { padding: 40px 24px 80px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Aero<span>.</span></div>
    <nav>
      <a href="#">Store</a>
      <a href="#">Leaderboards</a>
      <a href="#">Discord</a>
    </nav>
    <div class="header-right">
      <a href="#" class="login-btn">Log in</a>
    </div>
  </header>

  <div class="hero">
    <div class="hero-bg"></div>
    <div class="hero-content">
      <h1>Aero PvP</h1>
      <p>The premier Minecraft experience.</p>
      
      <a href="#" class="play-btn">
        Play Now
      </a>
      
      <div class="online-status">
        <div class="online-dot"></div>
        <span>1,852 Online</span>
      </div>
    </div>
  </div>

  <section class="arenas">
    <h2>Choose Your Arena</h2>
    
    <div class="grid">
      
      <div class="card">
        <img src="https://aero-pvp.github.io/assets/images/Crystal.png" alt="Crystal Kit" class="card-bg-image">
        <div class="card-overlay"></div>
        <div class="card-content">
          <h3>Crystal</h3>
          <p>High-octane explosive combat.</p>
        </div>
      </div>

      <div class="card">
        <img src="https://aero-pvp.github.io/assets/images/Mace.png" alt="Mace Kit" class="card-bg-image">
        <div class="card-overlay"></div>
        <div class="card-content">
          <h3>Mace</h3>
          <p>Utilize the new 1.21 mechanics.</p>
        </div>
      </div>

      <div class="card">
        <img src="https://aero-pvp.github.io/assets/images/Sword.png" alt="Sword Kit" class="card-bg-image">
        <div class="card-overlay"></div>
        <div class="card-content">
          <h3>Sword</h3>
          <p>Classic 1.9+ sword combat.</p>
        </div>
      </div>

    </div>
  </section>

</body>
</html>
